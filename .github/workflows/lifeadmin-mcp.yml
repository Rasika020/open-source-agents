name: LifeAdmin MCP

on:
  pull_request:
    paths:
      - "tools/lifeadmin-mcp/**"
      - ".github/workflows/lifeadmin-mcp.yml"
  push:
    paths:
      - "tools/lifeadmin-mcp/**"
      - ".github/workflows/lifeadmin-mcp.yml"

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    defaults:
      run:
        working-directory: tools/lifeadmin-mcp

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Compile project modules
        run: python -m compileall -q lifeadmin_mcp lifeadmin_agent tests

      - name: Run tests
        run: python -m pytest -q

      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
